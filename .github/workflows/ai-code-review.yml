name: AI Code Review

# Runs Marafiq's rules-aware AI reviewer on every pull request.
# See .ai-review/README.md for setup + how to switch AI providers.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR at a time. If a new push arrives while a review is running,
# cancel the old one so the developer sees results for the LATEST commit only.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read          # to fetch base ref for the diff
      pull-requests: write    # to post PR summary + inline comments
      issues: write           # sticky summary comment lives on the issue endpoint
      models: read            # for GitHub Models provider (harmless otherwise)

    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Make sure base ref is present for the diff
        run: |
          git fetch --no-tags --depth=100 origin \
            "+${{ github.event.pull_request.base.sha }}:refs/ai-review/base" || true
          git fetch --no-tags --depth=100 origin \
            "+${{ github.event.pull_request.head.sha }}:refs/ai-review/head" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .ai-review/package.json

      - name: Install reviewer deps
        working-directory: .ai-review
        run: npm install --no-audit --no-fund

      - name: Run AI review
        working-directory: .ai-review
        env:
          # ---- Provider selection (change here to swap Gemini → Claude/Copilot later) ----
          AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER || 'gemini' }}

          # ---- Gemini (current) ----
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # ---- Future providers — leave secrets unset until you switch ----
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

          # ---- Platform (auto-injected by GitHub) ----
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ---- Behaviour ----
          # Flip to 1 during rollout so the check comments but never blocks merges.
          AI_REVIEW_SOFT: ${{ vars.AI_REVIEW_SOFT || '0' }}
        run: node src/index.mjs
