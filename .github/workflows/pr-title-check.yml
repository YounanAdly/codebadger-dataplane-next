name: Auto PR Title

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: auto-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-title:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: files
        run: |
          CHANGED=$(
            git diff --name-only \
              ${{ github.event.pull_request.base.sha }} \
              ${{ github.event.pull_request.head.sha }} \
              | tr '\n' ', '
          )

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Files: $CHANGED"

      - name: Generate title via Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FILES="${{ steps.files.outputs.changed }}"

          PROMPT="Based on these changed files: $FILES

          Generate a concise PR title following conventional commits format.

          Rules:
          - Use one of these prefixes:
            feat | fix | style | i18n | test | chore | docs | ci | refactor | perf | build
          - Maximum 10 words.
          - Be specific about what changed.
          - Output ONLY the title.
          - No quotes.
          - No markdown.

          Examples:
          feat: add contact-us page with form
          style: update contact-us color tokens
          fix: resolve dashboard loading spinner
          i18n: add Arabic translations for login"

          PAYLOAD=$(
            jq -n \
              --arg prompt "$PROMPT" \
              '{
                contents: [
                  {
                    parts: [
                      {
                        text: $prompt
                      }
                    ]
                  }
                ]
              }'
          )

          echo "=== PAYLOAD ==="
          echo "$PAYLOAD"

          RESPONSE=$(
            curl -s \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          )

          echo "=== RAW RESPONSE ==="
          echo "$RESPONSE"
          echo "==================="

          TITLE=$(
            echo "$RESPONSE" |
              jq -r '.candidates[0].content.parts[0].text // empty' |
              tr -d '"\n' |
              xargs
          )

          echo "=== EXTRACTED TITLE ==="
          echo "'$TITLE'"
          echo "======================="

          if [[ ! "$TITLE" =~ ^(feat|fix|style|i18n|test|chore|docs|ci|refactor|perf|build):\ .+ ]]; then
            echo "Generated title invalid or empty: '$TITLE'"
            echo "title=chore: update code" >> "$GITHUB_OUTPUT"
          else
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          fi

          echo "Final title: $TITLE"

      - name: Update PR title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TITLE="${{ steps.generate.outputs.title }}"
          CURRENT_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [ -n "$NEW_TITLE" ] && [ "$NEW_TITLE" != "$CURRENT_TITLE" ]; then
            echo "Updating PR #$PR_NUMBER title to: $NEW_TITLE"

            gh pr edit "$PR_NUMBER" \
              --title "$NEW_TITLE"
          else
            echo "Title unchanged or empty. Skipping."
            echo "Current: '$CURRENT_TITLE'"
            echo "New: '$NEW_TITLE'"
          fi
